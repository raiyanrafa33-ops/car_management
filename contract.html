<!DOCTYPE html>
<html>
<head>
  <title>Contract</title>
  <link rel="stylesheet" href="contract.css">
</head>
<body>

  <h1>Car Contract</h1>

  <form>
    <p>Customer Name:</p>
    <input type="text">

    <p>Phone:</p>
    <input type="text">

    <p>Car Model:</p>
    <input type="text">

    <p>Start Date:</p>

    <p>End Date:</p>
    <input type="date">

    <p>Total Price:</p>
    <input type="number">

    <p><input type="checkbox"> I agree to the terms</p>

    <button>Confirm</button>
  </form>

</body>
</html>
